name: Frontend Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/frontend-tests.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build
        run: bun run build