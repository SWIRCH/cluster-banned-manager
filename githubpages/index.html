<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluster Banned Manager</title>
    
    <link rel="canonical" href="https://cbmwot.vercel.app/">
    
    <meta property="og:title" content="Cluster Banned Manager - Документация">
    <meta property="og:description" content="Управление подключением к серверам World of Tanks Blitz и Tanks Blitz">
    <meta property="og:url" content="https://cbmwot.vercel.app/">
    <meta property="og:type" content="website">
    
    <!-- 301 редирект -->
    <meta http-equiv="refresh" content="0; url=https://cbmwot.vercel.app/">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0f0f1a;
            color: #e0e0e0;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid #2a2a4a;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        p {
            color: #8888aa;
            margin: 0 0 4px 0;
        }
        a {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .counter {
            margin-top: 16px;
            font-size: 14px;
            color: #666688;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>🔄 Документация переехала</h1>
    <p>Новый сайт: <a href="https://cbmwot.vercel.app/">cbmwot.vercel.app</a></p>
    <p class="counter">Перенаправление через <span id="seconds">5</span> секунд...</p>

    <script>
        let seconds = 5;
        const counterEl = document.getElementById('seconds');
        
        const interval = setInterval(() => {
            seconds--;
            counterEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'https://cbmwot.vercel.app/';
            }
        }, 1000);

        document.querySelector('a')?.addEventListener('click', (e) => {
            clearInterval(interval);
        });
    </script>
</body>
</html>
